<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            font: 1em sans-serif;
            border-collapse: collapse;
            border-spacing: 0;
        }

        table td{
            border: 2px solid black;
            padding: 10px 10px ;
            color: purple;
        }

        table thead th {
            background-color: black;
            color: white;
        }


        table tbody td + td {
            color: blue;
        }

        table tbody td:last-child {
            color: red;
            text-align: right;
        }

        tfoot > tr > th  {
            text-decoration: underline;
            text-align: right;
            border: 0px;

        }

        tfoot th + td {
            background-color: black;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Qty.</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Lawnchair</td>
                <td>1</td>
                <td>137.00</td>
            </tr>

            <tr>
                <td>Ricebar</td>
                <td>2</td>
                <td>1.10</td>
            </tr>

            <tr>
                <td>Book</td>
                <td>1</td>
                <td>10.45</td>
            </tr>

            <tr>
                <td>Stand</td>
                <td>1</td>
                <td>137.00</td>
            </tr>

            <tr>
                <td>Toy</td>
                <td>2</td>
                <td>1.10</td>
            </tr>

        </tbody>
        
        <tfoot>
            <tr>
                <th colspan="2">Total:</th>
                <td>148.55</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
