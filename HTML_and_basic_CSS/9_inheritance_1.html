<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #box1 {
            /* inherited by child elements */
            color: red; 
            /* Not inherited by child elements
            child has to explicitly mention to inherit this property */
            height: 100px;
            border: 2px solid black;
        }

        #box2 {
            border: 1px solid green;
            height: inherit;
        }


        #box3 {
            border: 1px solid red;
        }
    </style>
</head>
<body>
    
    <div id="box1">
        Parent div
        <div id="box2">Child Div 1</div>
        <div id="box3">Child Div 2</div>
    </div>
</body>
</html>
