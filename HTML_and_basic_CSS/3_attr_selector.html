<!DOCTYPE html>
<!--
    TOPIC: CSS Attribute Selectors
    ------------------------------
    Attribute selectors let you style elements based on the attributes they
    have (or the values of those attributes), without adding extra classes.

    Syntax cheat sheet (attr = attribute name, v = value):
        [attr]        -> element HAS the attribute (any value)
        [attr="v"]    -> value is EXACTLY "v"
        [attr~="v"]   -> value is a space-separated list of words, one of which is "v"
        [attr^="v"]   -> value STARTS with "v"
        [attr$="v"]   -> value ENDS with "v"
        [attr*="v"]   -> value CONTAINS "v" anywhere
        [attr|="v"]   -> value is "v" or starts with "v-" (used for languages, e.g. lang="en-US")
        [attr="v" i]  -> the "i" flag makes the match case-INsensitive

    TRY IT: Open in a browser and check which <li> gets which style.
    Then change the data="" values and predict the result before refreshing.

    NOTE: In real projects, custom attributes should be prefixed with "data-"
    (e.g. data-topic="WT"). "data" alone works for practice, but "data-*" is
    the valid HTML way and can also be read from JavaScript via element.dataset.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Has a "data" attribute at all -> HTML, DOM, Node.js, XML turn green.
           "Images" has no data attribute, so it stays the default color. */
        [data] {
            color: green;
        }

        /* Exact match: only data="WT" (HTML). "WT JavaScript" is NOT an exact match. */
        [data="WT"] {
            background-color: yellow;
        }

        /* Word match: the value is split on spaces and "WT" must be one of the words.
           Matches "WT" (HTML) AND "WT JavaScript" (DOM). */
        [data~="WT"] {
            font-style: italic;
        }

        /* Starts with "W": matches "WT" and "WT JavaScript".
           "web server" is NOT matched because matching is case-sensitive by default (w != W). */
        [data^="W"] {
            text-decoration: underline;
        }

        /* Ends with "kup": matches "markup" (XML). */
        [data$="kup"]{
            font-weight: 900;
        }

        /* Contains "wt java" anywhere, and the "i" flag ignores case,
           so it matches "WT JavaScript" (DOM). */
        [data*="wt java" i] {
            text-decoration: underline;
            text-decoration-style: dotted;
        }
    </style>
</head>
<body>
    <ul>
        <li data="WT">HTML</li>
        <li data="WT JavaScript">DOM</li>
        <li data="web server">Node.js</li>
        <li data="markup">XML</li>
        <li>Images</li>
    </ul>
</body>
</html>
