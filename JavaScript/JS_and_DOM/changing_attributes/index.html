<!DOCTYPE html>
<!--
    Open this file in a browser, open the Console (F12), and click the buttons.
    script.js changes the attributes of the <img> and the buttons below.
    Watch them change live in the Elements tab of DevTools.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changing Attributes</title>
    <script src="script.js" defer></script>
</head>
<body>
    <!-- src, alt, width and id are all attributes that script.js reads or changes.
         src is a RELATIVE path: the image sits in the same folder as this file. -->
    <img src="cat.jpg" alt="A cat" width="200" id="pet">

    <p>
        <button id="enlarge">Click to enlarge image</button>
        <button id="reset">Reset size</button>
        <button id="swap_animal">Click to see a dog</button>
    </p>
</body>
</html>
