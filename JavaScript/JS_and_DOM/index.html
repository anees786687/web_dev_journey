<!DOCTYPE html>
<!--
    Open this file in a browser, then open the Console (F12 -> "Console" tab).

    - objects.js      only prints to the console (objects practice).
    - dom_basics.js   changes the first section and searches the "Shopping list" section.
    - click_events.js makes the "Click me" button in the last section work.

    The .red and .blue_text classes in <style> are added and removed by JS
    (with classList) in dom_basics.js and click_events.js.

    `defer` tells the browser to download the scripts now but run them only
    after the whole HTML document has been parsed, so the elements exist.
    Deferred scripts run in the order they appear.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Objects, DOM and Events</title>
    <script src="objects.js" defer></script>
    <script src="dom_basics.js" defer></script>
    <script src="click_events.js" defer></script>
    <style>
        .red {
            background-color: red;
        }

        .blue_text {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <!-- Used by dom_basics.js, sections 1-3 -->
    <section>
        <h1 id="title" class="red">Original heading from the HTML file</h1>
        <p class="note">Original paragraph from the HTML file.</p>
    </section>
    <hr>
    <!-- Used by dom_basics.js, section 4 (querySelector / querySelectorAll) -->
    <section>
        <h2>Shopping list</h2>
        <p class="intro">Things to buy this week.</p>
        <p class="urgent">Buy the urgent ones first!</p>
        <ul id="list">
            <li>Rice</li>
            <li class="urgent">Milk</li>
            <li>Bread</li>
            <li class="urgent">Eggs</li>
        </ul>
    </section>
    <hr>
    <!-- Used by click_events.js -->
    <section>
        <button id="demo_button">Click me</button>
        <p id="demo_output">Nothing has happened yet</p>
    </section>
</body>
</html>
