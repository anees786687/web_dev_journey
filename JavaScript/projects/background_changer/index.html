<!DOCTYPE html>
<!--
    PROJECT: Background changer
    Open this file in a browser and click the buttons.
    The page's background (the strip above and below the boxes) changes colour.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Colors</title>
    <link rel="stylesheet" href="style.css">
    <!-- defer: run the script after the buttons below exist -->
    <script src="script.js" defer></script>
</head>
<body>
    <div class="button_holder">
        <div class="button_box red_box">
            <button class="red_button">Red Background</button>
        </div>
        <div class="button_box blue_box">
            <button class="blue_button">Blue Background</button>
        </div>
        <div class="button_box green_box">
            <button class="green_button">Green Background</button>
        </div>
    </div>
</body>
</html>
