<!DOCTYPE html>
<!--
    TOPIC: Flexbox
    --------------
    Flexbox is a ONE-dimensional layout system: it arranges items in a single
    row OR a single column, and handles spacing and alignment for you.

    Two roles:
        FLEX CONTAINER -> the parent with "display: flex" (the <section>)
        FLEX ITEMS     -> its DIRECT children (the <article>s)

    Two axes:
        MAIN axis  -> the direction items are placed in (set by flex-direction)
        CROSS axis -> perpendicular to the main axis
        justify-content aligns along the MAIN axis, align-items along the CROSS axis.

    All the explanations are in style.css. Uncomment one property at a time
    and refresh to see what it does.

    Interactive practice: https://flexboxfroggy.com
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- this is our flex container -->
    <section class="container">
        <!-- these are the flex items -->
        <!-- ⚠️ Small HTML mistake: put a space between attributes, e.g. id="a_1" class="flex-item".
             Browsers still understand it, but it is invalid HTML. -->
        <article id = "a_1"class="flex-item">Article 1</article>
        <article id = "a_2"class="flex-item">Article 2</article>
        <article id = "a_3"class="flex-item">Article 3</article>
        <article id = "a_4"class="flex-item">Article 4</article>
        <article id = "a_5"class="flex-item">Article 5</article>
        <article id = "a_6"class="flex-item">Article 6</article>
        <article id = "a_7"class="flex-item">Article 7</article>
        <article id = "a_7"class="flex-item">Article 8</article>
        <article id = "a_7"class="flex-item">Article 9</article>
        <article id = "a_7"class="flex-item">Article 10</article>
        <article id = "a_7"class="flex-item">Article 11</article>
        <article id = "a_7"class="flex-item">Article 12</article>
        <article id = "a_7"class="flex-item">Article 13</article>
        <article id = "a_7"class="flex-item">Article 14</article>


    </section>
</body>
</html>
